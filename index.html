<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page – UI/UX Designer</title>

    <!-- CSS LINK -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-left">
            <img src="assets/logo.png" alt="Logo" class="logo">
        </div>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Resume</a>
            <a href="#">Contact</a>
        </nav>

        <a href="#" class="hire-btn">Hire Me →</a>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">

        <!-- LEFT CONTENT -->
        <div class="hero-text">
            <p class="small-text">Hello, I’m</p>
            <h3 class="name">Jaydev Patil</h3>

            <h1 class="title">UI/UX and Product Designer</h1>

            <p class="description">
                I create clean, modern, and highly responsive UI/UX designs.
                Skilled in HTML, CSS, JavaScript, and UI/UX tools.
            </p>

            <!-- BUTTONS -->
            <div class="hero-buttons">
                <a href="#" class="btn hire">Hire Me</a>
                <a href="assets/RESUME JAYDEV SHYAM PATIL.pdf" class="btn resume" download>
                    Download Resume ↓
                </a>
            </div>

            <!-- RESUME UPLOAD -->
            <div class="resume-upload">
                <label for="resume">Upload Your Resume</label>
                <input type="file" id="resume" accept=".pdf,.doc,.docx">
                <p id="file-name">No file selected</p>
            </div>
        </div>

        <!-- RIGHT IMAGE -->
        <div class="hero-image">
            <div class="circle"></div>
            <img src="assets/jaydev.jfif" alt="Profile Image" class="profile-img">
        </div>

    </section>

    <!-- SOCIAL LINKS -->
    <div class="social-box">
        <span>Follow Me On:</span>
        <a href="#">🌐</a>
        <a href="#"></a>
        <a href="#"></a>
        <a href="#"></a>
    </div>

    <!-- JS LINK -->
    <script src="script.js"></script>

</body>
</html>
